name: Check the org secrets

# Manual: confirms that the organization's publishing and README sync secrets still work. Prints only HTTP statuses.
on:
  workflow_dispatch:
    inputs:
      curseforge-project:
        description: A CurseForge project ID the session may edit
        default: "1562739"
      six-seven-project:
        description: A 67minecraft project ID the token may edit; its description is written back unchanged
        default: "VzciPAV5"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check each secret
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          SIX_SEVEN_TOKEN: ${{ secrets.SIX_SEVEN_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_SESSION: ${{ secrets.CURSEFORGE_SESSION }}
          CURSEFORGE_PROJECT: ${{ inputs.curseforge-project }}
          SIX_SEVEN_PROJECT: ${{ inputs.six-seven-project }}
        run: |
          failed=0
          check() {
            local name=$1 value=$2; shift 2
            if [ -z "$value" ]; then echo "$name: not set"; failed=1; return; fi
            local code
            code=$(curl -s -o /tmp/body -m 30 -w '%{http_code}' -A 'AngelicIndustries/mod-workflows' "$@")
            if [ "$code" = 200 ] || [ "$code" = 204 ]; then echo "$name: ok"; return; fi
            # The services' error messages name the reason (a bad token or a missing scope), never the token
            echo "$name: HTTP $code $(jq -r '.description // .error // .message // empty' /tmp/body 2>/dev/null | head -c 200)"
            failed=1
          }
          check MAVEN_USER/MAVEN_PASSWORD "$MAVEN_PASSWORD" -u "$MAVEN_USER:$MAVEN_PASSWORD" https://maven.angelic.industries/api/auth/me
          check MODRINTH_TOKEN "$MODRINTH_TOKEN" -H "Authorization: $MODRINTH_TOKEN" https://api.modrinth.com/v2/user
          # 67minecraft tokens often lack the user scope, so write a description back unchanged, as README sync does
          curl -s "https://67minecraft.com/api/v2/project/$SIX_SEVEN_PROJECT" | jq '{body}' > /tmp/six-seven-body.json
          check SIX_SEVEN_TOKEN "$SIX_SEVEN_TOKEN" -X PATCH -H "Authorization: $SIX_SEVEN_TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/six-seven-body.json "https://67minecraft.com/api/v2/project/$SIX_SEVEN_PROJECT"
          check CURSEFORGE_TOKEN "$CURSEFORGE_TOKEN" -H "X-Api-Token: $CURSEFORGE_TOKEN" https://minecraft.curseforge.com/api/game/versions
          check CURSEFORGE_SESSION "$CURSEFORGE_SESSION" -H "Cookie: ${CURSEFORGE_SESSION#Cookie: }" -H "Accept: application/json" \
            -H "Referer: https://authors.curseforge.com/" -A "Mozilla/5.0 (X11; Linux x86_64; rv:140.0) Gecko/20100101 Firefox/140.0" \
            "https://authors.curseforge.com/_api/projects/description/$CURSEFORGE_PROJECT"
          exit $failed
